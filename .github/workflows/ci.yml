name: CI

# SKILL.md Phase 0 CI guards. All hard gates (must pass to merge): dataset
# metadata is current, the Martha Modelfile is in sync with the persona source,
# Rust tests pass, clippy is warning-free, the frontend type-checks, and eslint
# is clean.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataset-and-persona:
    name: dataset metadata + persona sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The persona .txt is the single source of truth: fail if a class folder's
      # metadata.json is stale or if Martha.Modelfile drifted from the .txt.
      - name: Check dataset metadata is current
        run: python rag/scaffold_metadata.py --check
      - name: Check Martha.Modelfile is in sync with the persona
        run: python curriculum/generate_modelfile.py --check

  rust:
    name: rust tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri v2 Linux build dependencies (needed to compile the app library).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            build-essential file patchelf
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

  frontend:
    name: frontend typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint -- --max-warnings 0
