[package]
name = "schoolbox"
version = "0.1.0"
description = "SkoolBox AI Tutor - Offline-first learning platform"
authors = ["Foniolabs"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
# rustls (pure-Rust TLS) only — default-features off drops reqwest's default
# native-tls/OpenSSL backend, so the build needs no system libssl/libcrypto and
# the shipped binary carries its own TLS (better for offline distribution).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
bcrypt = "0.15"
dotenvy = "0.15"
